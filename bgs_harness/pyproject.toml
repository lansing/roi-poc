[project]
name = "bgs-harness"
version = "0.1.0"
description = "Background subtraction benchmark harness for YOLO pre-processing using pybgs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=12.0.0",
    "opencv-python-headless>=4.8.0",
    "pybgs>=3.3.0",
    "numpy>=1.24.0",
    # Frigate NVR motion-detector import chain (vendored at ../frigate, tag v0.18.0)
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "ruamel.yaml>=0.17.0",
    "requests>=2.31.0",
    "unidecode>=1.3.0",
    "psutil>=5.9.0",
    "py3nvml>=0.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness.py"]

[tool.hatch.build.targets.sdist]
exclude = [
    "outputs/*",
    "input_videos/*",
    ".venv/*",
]
